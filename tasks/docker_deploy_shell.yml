# Use like:
#   docker_deploy_shell_stop:  stop-services.sh
#   docker_deploy_shell_start: deploy.sh
#
---
- name: Detect docker compose command (supports both new and old style)
  when: docker_deploy_compose_bin == "auto"
  block:
    - name: Check for new style 'docker compose' (v2 plugin)
      ansible.builtin.command: docker compose version
      register: _docker_compose_v2_bin_check
      changed_when: false
      failed_when: false

    - name: Check for old style 'docker-compose' (v1 standalone)
      ansible.builtin.command: docker-compose version
      register: _docker_compose_v1_bin_check
      changed_when: false
      failed_when: false
      when: _docker_compose_v2_bin_check.rc != 0

    - name: Fail when no docker compose command is available
      ansible.builtin.fail:
        msg: >-
          Neither the new style 'docker compose' (v2 plugin) nor the old style
          'docker-compose' (v1 standalone) is available on the target host.
          Install one of them or set 'docker_deploy_compose_bin' explicitly.
      when:
        - _docker_compose_v2_bin_check.rc != 0
        - _docker_compose_v1_bin_check.rc != 0

    - name: Set docker compose command (prefer new style 'docker compose')
      ansible.builtin.set_fact:
        docker_deploy_compose_bin: "{{ 'docker compose' if _docker_compose_v2_bin_check.rc == 0 else 'docker-compose' }}"

    - name: Show detected docker compose command
      ansible.builtin.debug:
        msg: "Using docker compose command: {{ docker_deploy_compose_bin }}"
  tags: docker_deploy

- name: Template docker-compose
  template:
    dest: "{{ docker_deploy_base_folder }}/docker-compose.yml"
    src: "{{ docker_deploy_compose_template }}"
    backup: "{{ docker_deploy_compose_template_backup }}"
  when: docker_deploy_compose_template is defined
  register: docker_compose_template_out
  tags: docker_deploy

- name: Pull and build images before stopping and starting
  shell: "{{ docker_deploy_compose_bin }} pull && {{ docker_deploy_compose_bin }} build"
  args:
    chdir: "{{ docker_deploy_base_folder }}"
  when: docker_deploy_shell_start is defined or (docker_deploy_shell | default(false) | bool)
  tags: docker_deploy

- name: Stop service using shell command  # noqa: command-instead-of-shell
  shell: "{{ docker_deploy_shell_stop }}"
  args:
    chdir: "{{ docker_deploy_base_folder }}"
  when: docker_deploy_shell_stop is defined
  tags: docker_deploy

- name: Start service using shell command  # noqa: command-instead-of-shell
  shell: "{{ docker_deploy_shell_start if docker_deploy_shell_start is defined else (docker_deploy_shell_start_default if docker_deploy_shell_start_default is defined else (docker_deploy_compose_bin + ' up -d ' + (docker_deploy_shell_start_default_additional_parameters | default((docker_deploy_shell_start_default_additional_parameters_if_changed | default('')) if (docker_deploy_force_restart | default(false)) or (docker_compose_template_out is defined and docker_compose_template_out.changed) or docker_deploy_files_out.changed or docker_deploy_templates_out.changed or docker_deploy_git_repositories_out.changed else '')))) }}"
  args:
    chdir: "{{ docker_deploy_base_folder }}"
  when: docker_deploy_shell_start is defined or (docker_deploy_shell | default(false) | bool)
  tags: docker_deploy

- name: HealthCheck
  include_tasks: docker_healthcheck.yml
  tags:
    - docker_deploy
    - healthcheck
